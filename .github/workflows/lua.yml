name: CI Lua

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lua:
    name: Lua 5.4 y Luacheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Instalar Lua y Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 lua-check
      - name: Correr tests Lua
        run: lua5.4 tests/run_all.lua
      - name: Revisar el código Lua
        run: luacheck .
